<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GNI Solution — 경력증명서 진위확인</title><style>
:root{--coral:#D97757;--coral-d:#C2653F;--dark:#1E2630;--meta:#44546A;--line:#BFC5CE;--bg:#F6F7F9;--tint:#FAEDE6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic',Arial,sans-serif;background:var(--bg);color:var(--dark);line-height:1.35;
  word-break:keep-all;overflow-wrap:break-word}   /* 한글은 어절 단위 줄바꿈, 긴 영문·숫자만 강제 분리 */
.hd{background:#fff;border-bottom:1px solid var(--line);padding:13px 24px;font-weight:700;font-size:15px;
  display:flex;align-items:center;gap:14px}
.hd img{height:40px;width:auto;display:block;flex:none}
.hd small{display:block;font-size:11px;color:var(--meta);font-weight:400;margin-top:3px}
/* 언어 토글 — 우측 최상단 */
.lang{margin-left:auto;flex:none;display:flex;border:1px solid var(--line);overflow:hidden}
.lang button{height:28px;padding:0 12px;background:#fff;color:var(--meta);border:none;
  font-size:11.5px;font-weight:700;letter-spacing:.5px;cursor:pointer;font-family:inherit;
  touch-action:manipulation}
.lang button+button{border-left:1px solid var(--line)}
.lang button.on{background:var(--coral);color:#fff}
.lang button:hover:not(.on){background:var(--tint);color:var(--coral-d)}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 60px}
.sec{background:var(--coral);color:#fff;font-size:12px;font-weight:700;padding:8px 14px}
.card{background:#fff;border:1px solid var(--line);margin-bottom:16px}
.cb{padding:18px 20px}
.row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
input{height:44px;border:1px solid var(--line);padding:0 12px;font-size:16px;font-family:inherit;width:100%;
  border-radius:0;-webkit-appearance:none;appearance:none}
input:focus{outline:2px solid var(--coral);outline-offset:-2px}
button{height:44px;padding:0 22px;background:var(--coral);color:#fff;border:none;font-weight:700;
  font-size:15px;cursor:pointer;font-family:inherit;border-radius:0;-webkit-appearance:none;appearance:none;
  touch-action:manipulation}
button:hover{background:var(--coral-d)}
button:active{background:var(--coral-d)}
.badge{text-align:center;padding:24px 18px;border:2px solid var(--coral);background:var(--tint);margin-bottom:16px}
.badge .ic{font-size:40px;line-height:1}
.badge .en{font-size:26px;font-weight:800;letter-spacing:3px;color:var(--coral-d);margin-top:8px}
.badge .ko{font-size:14px;font-weight:700;color:var(--dark);margin-top:8px}
.badge .sb{font-size:11px;color:var(--meta);margin-top:8px;line-height:1.5}
.bad{border-color:var(--meta);background:var(--bg)}
.bad .en{color:var(--meta);letter-spacing:2px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--dark);color:#fff;padding:8px 10px;text-align:left;font-weight:700;width:130px}
td{border:1px solid var(--line);padding:8px 10px}
.nt{font-size:11px;color:var(--meta);line-height:1.6;padding:14px 20px;background:#fff;border:1px solid var(--line)}
.nt b{color:var(--coral-d)}
.nt p{margin:0}
.nt p+p{margin-top:5px}
/* 헤더 부제 — 한글구/영문구를 각각 통째로 줄바꿈 (단어 중간에서 끊기지 않게) */
.hd .nb{display:inline-block;white-space:nowrap}
.ft{font-size:10.5px;color:var(--meta);margin-top:18px;text-align:center;line-height:1.6}
/* ── 모바일 (QR은 대부분 폰으로 스캔) ── */
@media(max-width:560px){
  .hd{padding:11px 14px;gap:10px;font-size:13.5px;align-items:flex-start}
  .hd img{height:34px;margin-top:1px}
  .hd small{font-size:10px;margin-top:3px;line-height:1.5}
  .hd .dot{display:none}                    /* 좁은 화면에서는 가운뎃점 대신 줄바꿈 */
  .hd .nb{display:block;white-space:normal}  /* 한글구·영문구 각각 한 줄 */
  .lang button{height:26px;padding:0 9px;font-size:11px}
  .wrap{padding:14px 12px 40px}
  .cb{padding:14px 14px}
  .row{grid-template-columns:1fr;gap:10px}
  .badge{padding:20px 14px}
  .badge .ic{font-size:34px}
  .badge .en{font-size:21px;letter-spacing:2px}
  .badge .ko{font-size:13px}
  .badge .sb{font-size:10.5px}
  table{font-size:12px;display:block}
  tbody,tr{display:block;width:100%}
  th,td{display:block;width:100%}
  th{padding:6px 10px;font-size:11px;letter-spacing:.3px}
  td{padding:9px 10px;border-top:none}
  tr{margin-bottom:6px}
  .nt{padding:12px 14px;font-size:10.5px}
}
</style></head><body>
<div class="hd"><img src="gni_logo.png" alt="GNI Solution" onerror="this.style.display='none'">
  <div>GNI Solution Co., Ltd.
  <small><span class="nb" id="hdSub"></span></small></div>
  <div class="lang">
    <button id="bKR" onclick="setLang('kr')">KR</button>
    <button id="bEN" onclick="setLang('en')">EN</button>
  </div></div>
<div class="wrap">
 <div class="card"><div class="sec" id="secTitle"></div><div class="cb">
  <div class="row">
    <input id="q"  placeholder="">
    <input id="tk" placeholder="">
    <button id="btnGo" onclick="go()"></button>
  </div>
  <div id="src" style="font-size:11px;color:var(--meta);margin-top:9px"></div>
 </div></div>
 <div id="out"></div>
 <div class="nt" id="notes"></div>
 <div class="ft" id="foot"></div>
</div>
<script>
// 순수 JS SHA-256 (file:// 에서도 동작 — crypto.subtle 의존 없음)
function sha256hex(msg){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const u=unescape(encodeURIComponent(msg));
  const b=[]; for(let i=0;i<u.length;i++) b.push(u.charCodeAt(i)&255);
  const bl=b.length*8; b.push(0x80); while(b.length%64!==56) b.push(0);
  for(let i=7;i>=0;i--) b.push((Math.floor(bl/Math.pow(2,i*8)))&255);
  const R=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let i=0;i<b.length;i+=64){
    const w=new Array(64);
    for(let j=0;j<16;j++) w[j]=(b[i+j*4]<<24)|(b[i+j*4+1]<<16)|(b[i+j*4+2]<<8)|b[i+j*4+3];
    for(let j=16;j<64;j++){
      const s0=R(w[j-15],7)^R(w[j-15],18)^(w[j-15]>>>3);
      const s1=R(w[j-2],17)^R(w[j-2],19)^(w[j-2]>>>10);
      w[j]=(w[j-16]+s0+w[j-7]+s1)|0;
    }
    let [a,bb,c,d,e,f,g,h]=H;
    for(let j=0;j<64;j++){
      const S1=R(e,6)^R(e,11)^R(e,25), ch=(e&f)^(~e&g);
      const t1=(h+S1+ch+K[j]+w[j])|0;
      const S0=R(a,2)^R(a,13)^R(a,22), mj=(a&bb)^(a&c)^(bb&c);
      const t2=(S0+mj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;
    }
    H=[H[0]+a|0,H[1]+bb|0,H[2]+c|0,H[3]+d|0,H[4]+e|0,H[5]+f|0,H[6]+g|0,H[7]+h|0];
  }
  return H.map(x=>('00000000'+(x>>>0).toString(16)).slice(-8)).join('');
}
/* ════════ 문구 — KR / EN ════════ */
var STR={
 kr:{ htmlLang:'ko', title:'GNI Solution — 경력증명서 진위확인',
   hdSub:'경력증명서 진위확인 · Career Certificate Verification',
   secTitle:'발급번호 조회 · Certificate No.',
   phNo:'발급번호 예: 2026-0711', phCode:'조회코드 (증명서 QR 하단 8자리)', btn:'조회',
   loading:'DB 확인 중...',
   loaded:function(n){return '발급기록 '+n+'건 로드됨';},
   loadFail:'발급기록 DB를 불러오지 못했습니다.',
   okKo:'적법하게 발급된 경력증명서입니다',
   okSb:function(t){return '지엔아이솔루션㈜ 품질보증부 발급기록과 일치합니다.<br>확인 시각 '+t;},
   nfKo:'발급 기록을 찾을 수 없습니다',
   nfSb:function(k){return '발급번호 '+k+' 에 해당하는 기록이 없습니다.<br>번호를 다시 확인하시거나 품질보증부로 문의하십시오.';},
   cmKo:'조회코드가 일치하지 않습니다',
   cmSb:'증명서 좌측 하단 QR 아래의 <b>Code</b> 8자리를 입력하십시오.',
   recTitle:'발급 정보 · Issuance Record',
   thNo:'발급번호', thDate:'발급일', thType:'증명서 유형', thName:'성명',
   thTotal:'총 경력기간', thRows:'경력 기재건수', thIssued:'발급 기록시각',
   maskNote:'(개인정보 보호를 위해 일부 마스킹)',
   unitDays:' Days', unitRows:function(n){return n+' 건';},
   typeSuffix:' Certificate',
   notes:['· 본 페이지는 지엔아이솔루션㈜ 품질보증부가 발급한 <b>경력증명서의 발급 사실</b>을 확인합니다.',
          '· 개인정보 보호를 위해 <b>성명은 일부 마스킹</b>되며, 경력 상세·제출처는 공개하지 않습니다.',
          '· 증명서 원본 대조가 필요한 경우 품질보증부로 문의하십시오.'],
   foot:'GNI Solution Co., Ltd. · 품질보증부<br>Form GA-3 Career Certificate Verification' },
 en:{ htmlLang:'en', title:'GNI Solution — Career Certificate Verification',
   hdSub:'Career Certificate Verification — QA Department',
   secTitle:'Certificate No. Lookup',
   phNo:'Certificate No.  e.g. 2026-0711', phCode:'Code (8 characters, printed below the QR)', btn:'Verify',
   loading:'Loading database...',
   loaded:function(n){return n+' issuance record(s) loaded';},
   loadFail:'Unable to load the issuance database.',
   okKo:'This is a validly issued Career Certificate',
   okSb:function(t){return 'It matches the issuance record of GNI Solution Co., Ltd. — QA Department.<br>Verified at '+t;},
   nfKo:'No issuance record found',
   nfSb:function(k){return 'No record matches certificate no. '+k+'.<br>Please check the number, or contact the QA Department.';},
   cmKo:'The verification code does not match',
   cmSb:'Enter the 8-character <b>Code</b> printed below the QR at the bottom left of the certificate.',
   recTitle:'Issuance Record',
   thNo:'Certificate No.', thDate:'Issue Date', thType:'Certificate Type', thName:'Name',
   thTotal:'Total Period', thRows:'Career Entries', thIssued:'Recorded At',
   maskNote:'(partially masked for privacy)',
   unitDays:' Days', unitRows:function(n){return n+(Number(n)===1?' entry':' entries');},
   typeSuffix:' Certificate',
   notes:['· This page confirms <b>the fact of issuance</b> of a Career Certificate issued by the QA Department of GNI Solution Co., Ltd.',
          '· <b>Names are partially masked</b> for privacy. Career details and the recipient are not disclosed.',
          '· To verify against the original document, please contact the QA Department.'],
   foot:'GNI Solution Co., Ltd. · QA Department<br>Form GA-3 Career Certificate Verification' }
};
var LANG='kr', LSKEY='gni_verify_lang';
var DB={}, DBREADY=false, DBOK=false, SHOWN=false;
function TT(){ return STR[LANG]; }
function setLang(L){
  LANG=(L==='en')?'en':'kr';
  try{ localStorage.setItem(LSKEY,LANG); }catch(e){}
  var s=TT();
  document.documentElement.lang=s.htmlLang;
  document.title=s.title;
  document.getElementById('hdSub').textContent=s.hdSub;
  document.getElementById('secTitle').textContent=s.secTitle;
  document.getElementById('q').placeholder=s.phNo;
  document.getElementById('tk').placeholder=s.phCode;
  document.getElementById('btnGo').textContent=s.btn;
  document.getElementById('notes').innerHTML=s.notes.map(function(x){return '<p>'+x+'</p>';}).join('');
  document.getElementById('foot').innerHTML=s.foot;
  document.getElementById('bKR').className=(LANG==='kr')?'on':'';
  document.getElementById('bEN').className=(LANG==='en')?'on':'';
  document.getElementById('src').textContent = DBREADY
    ? (DBOK ? s.loaded(Object.keys(DB).length) : s.loadFail) : s.loading;
  if(SHOWN) go();
}
function initLang(){
  var L=null;
  try{ L=localStorage.getItem(LSKEY); }catch(e){}
  if(!L){ var p=new URLSearchParams(location.search).get('lang'); if(p) L=p.toLowerCase(); }
  if(!L) L=((navigator.language||'').toLowerCase().indexOf('ko')===0)?'kr':'en';
  setLang(L);
}

fetch('gni_career_db.json?_='+Date.now()).then(function(r){return r.ok?r.json():{};}).then(function(j){
  DB=j||{}; DBREADY=true; DBOK=true;
  document.getElementById('src').textContent=TT().loaded(Object.keys(DB).length);
  var p=new URLSearchParams(location.search), id=p.get('id'), t=p.get('t');
  if(id){ document.getElementById('q').value=id; if(t) document.getElementById('tk').value=t; go(); }
}).catch(function(){ DBREADY=true; DBOK=false;
  document.getElementById('src').textContent=TT().loadFail; });

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function go(){
  var s=TT();
  var k=document.getElementById('q').value.trim();
  var t=document.getElementById('tk').value.trim().toUpperCase();
  var r=DB[k], o=document.getElementById('out');
  SHOWN=true;
  if(!r){
    o.innerHTML='<div class="badge bad"><div class="ic">&#9888;</div><div class="en">NOT FOUND</div>'
      +'<div class="ko">'+s.nfKo+'</div>'
      +'<div class="sb">'+s.nfSb(esc(k))+'</div></div>'; return;
  }
  if(r.th && sha256hex(k+':'+t).slice(0,32)!==r.th){
    o.innerHTML='<div class="badge bad"><div class="ic">&#9888;</div><div class="en">CODE MISMATCH</div>'
      +'<div class="ko">'+s.cmKo+'</div>'
      +'<div class="sb">'+s.cmSb+'</div></div>'; return;
  }
  var now=new Date().toLocaleString(LANG==='kr'?'ko-KR':'en-GB');
  o.innerHTML='<div class="badge"><div class="ic">&#10004;</div><div class="en">VERIFIED</div>'
   +'<div class="ko">'+s.okKo+'</div>'
   +'<div class="sb">'+s.okSb(now)+'</div></div>'
   +'<div class="card"><div class="sec">'+s.recTitle+'</div><div class="cb"><table>'
   +'<tr><th>'+s.thNo+'</th><td>'+esc(r.no)+'</td></tr>'
   +'<tr><th>'+s.thDate+'</th><td>'+esc(r.date)+'</td></tr>'
   +'<tr><th>'+s.thType+'</th><td>'+esc(r.type)+s.typeSuffix+'</td></tr>'
   +'<tr><th>'+s.thName+'</th><td>'+esc(r.name)
     +' <span style="color:var(--meta);font-size:11px">'+s.maskNote+'</span></td></tr>'
   +'<tr><th>'+s.thTotal+'</th><td>'
     +(r.totalDays==null?'&mdash;':Number(r.totalDays).toLocaleString('en-US')+s.unitDays)+'</td></tr>'
   +'<tr><th>'+s.thRows+'</th><td>'+(r.rowCount==null?'&mdash;':s.unitRows(r.rowCount))+'</td></tr>'
   +'<tr><th>'+s.thIssued+'</th><td>'+esc(r.issuedAt)+'</td></tr>'
   +'</table></div></div>';
}
initLang();
</script></body></html>
